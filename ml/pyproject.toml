[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-lab-evaluation"
version = "0.1.0"
description = "Deterministic offline recommendation evaluation for Recipe Lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "recipe-lab-api==0.1.0",
]

[tool.uv.sources]
recipe-lab-api = { workspace = true }

[project.scripts]
recipe-lab-eval = "recipe_lab_evaluation.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.20,<2.0",
  "pytest>=8.3,<10.0",
  "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recipe_lab_evaluation = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["../backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
