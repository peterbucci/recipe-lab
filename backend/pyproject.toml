[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-lab-api"
version = "0.1.0"
description = "FastAPI service for structured, versioned recipes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.19,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.8,<3.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
recipe-lab-curator = "app.catalog_curators.cli:main"
recipe-lab-measurements = "app.measurement_audit:main"
recipe-lab-seed = "app.seeds.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.20,<2.0",
  "pytest>=8.3,<10.0",
  "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.seeds.data" = ["*.json", "*.md"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
