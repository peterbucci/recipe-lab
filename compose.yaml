name: recipe-lab

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17.11-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recipe_lab}
      POSTGRES_USER: ${POSTGRES_USER:-recipe_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipe_lab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-recipe_lab} -d ${POSTGRES_DB:-recipe_lab}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-recipe_lab}:${POSTGRES_PASSWORD:-recipe_lab}@db:5432/${POSTGRES_DB:-recipe_lab}
      DATABASE_OPERATION_TIMEOUT_SECONDS: ${DATABASE_OPERATION_TIMEOUT_SECONDS:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-1209600}
      AUTH_SESSION_TOUCH_INTERVAL_SECONDS: ${AUTH_SESSION_TOUCH_INTERVAL_SECONDS:-300}
      AUTH_RECENT_TTL_SECONDS: ${AUTH_RECENT_TTL_SECONDS:-600}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-2097152}
      ABUSE_RATE_LIMIT_SECRET: ${ABUSE_RATE_LIMIT_SECRET:-recipe-lab-local-development-rate-limit-secret}
      INTERNAL_NETWORK_SIGNAL_SECRET: ${INTERNAL_NETWORK_SIGNAL_SECRET:-recipe-lab-local-internal-network-signal-secret}
      INTERNAL_NETWORK_SIGNAL_TTL_SECONDS: ${INTERNAL_NETWORK_SIGNAL_TTL_SECONDS:-30}
      ABUSE_RATE_LIMIT_WINDOW_SECONDS: ${ABUSE_RATE_LIMIT_WINDOW_SECONDS:-60}
      ABUSE_RATE_LIMIT_AUTH_NETWORK: ${ABUSE_RATE_LIMIT_AUTH_NETWORK:-120}
      ABUSE_RATE_LIMIT_AUTH_IDENTITY: ${ABUSE_RATE_LIMIT_AUTH_IDENTITY:-30}
      ABUSE_RATE_LIMIT_DRAFT_ACCOUNT: ${ABUSE_RATE_LIMIT_DRAFT_ACCOUNT:-120}
      ABUSE_RATE_LIMIT_DRAFT_NETWORK: ${ABUSE_RATE_LIMIT_DRAFT_NETWORK:-600}
      ABUSE_RATE_LIMIT_FORK_ACCOUNT: ${ABUSE_RATE_LIMIT_FORK_ACCOUNT:-30}
      ABUSE_RATE_LIMIT_FORK_NETWORK: ${ABUSE_RATE_LIMIT_FORK_NETWORK:-120}
      ABUSE_RATE_LIMIT_PUBLICATION_ACCOUNT: ${ABUSE_RATE_LIMIT_PUBLICATION_ACCOUNT:-30}
      ABUSE_RATE_LIMIT_PUBLICATION_NETWORK: ${ABUSE_RATE_LIMIT_PUBLICATION_NETWORK:-120}
      ABUSE_RATE_LIMIT_REPORT_ACCOUNT: ${ABUSE_RATE_LIMIT_REPORT_ACCOUNT:-30}
      ABUSE_RATE_LIMIT_REPORT_NETWORK: ${ABUSE_RATE_LIMIT_REPORT_NETWORK:-120}
      ABUSE_RATE_LIMIT_INTERACTION_ACCOUNT: ${ABUSE_RATE_LIMIT_INTERACTION_ACCOUNT:-600}
      ABUSE_RATE_LIMIT_INTERACTION_NETWORK: ${ABUSE_RATE_LIMIT_INTERACTION_NETWORK:-2400}
      RECOMMENDATION_MAX_CANDIDATES: ${RECOMMENDATION_MAX_CANDIDATES:-2000}
      RECOMMENDATION_MAX_PROFILE_RECORDS: ${RECOMMENDATION_MAX_PROFILE_RECORDS:-5000}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:3000/api/auth/callback}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_ALLOWED_SIGNING_ALGORITHMS: ${OIDC_ALLOWED_SIGNING_ALGORITHMS:-RS256}
      OIDC_LOGIN_TTL_SECONDS: ${OIDC_LOGIN_TTL_SECONDS:-600}
      OIDC_HTTP_TIMEOUT_SECONDS: ${OIDC_HTTP_TIMEOUT_SECONDS:-5}
      OIDC_CLOCK_SKEW_SECONDS: ${OIDC_CLOCK_SKEW_SECONDS:-30}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/workspace/backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2); raise SystemExit(0 if response.status == 200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      RECIPE_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_NETWORK_SIGNAL_SECRET: ${INTERNAL_NETWORK_SIGNAL_SECRET:-recipe-lab-local-internal-network-signal-secret}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_data:/app/.next
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(async (response) => { if (response.status !== 200 || await response.text() !== 'ok\\n') process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_next_data:
  frontend_node_modules:
