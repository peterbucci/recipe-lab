name: Set up locked Node.js
description: Install the repository's exact Node.js toolchain with npm lock caching.
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: "22.23.2"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
