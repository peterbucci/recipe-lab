name: Set up locked Python
description: Install the repository's exact Python and uv toolchain with lock caching.
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.13.15"

    - name: Set up locked Python resolver
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.12.6"
        enable-cache: true
        cache-dependency-glob: uv.lock
