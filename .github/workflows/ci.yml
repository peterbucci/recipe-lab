name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@localhost:5432/recipe_lab_test
      TEST_DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@localhost:5432/recipe_lab_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recipe_lab_test
          POSTGRES_USER: recipe_lab
          POSTGRES_PASSWORD: recipe_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_lab -d recipe_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check backend formatting
        run: python -m ruff format --check .

      - name: Lint backend
        run: python -m ruff check --output-format=github .

      - name: Type-check backend
        run: python -m mypy app migrations tests

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Check migration completeness
        run: python -m alembic check

      - name: Test backend
        run: python -m pytest

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Validate Playwright configuration
        run: npx playwright test --list
