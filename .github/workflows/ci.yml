name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml

  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up locked Python
        uses: ./.github/actions/setup-python

      - name: Set up locked Node.js
        uses: ./.github/actions/setup-node

      - name: Reproduce contract dependencies
        run: |
          uv lock --check
          uv sync --frozen --package recipe-lab-api
          uv pip check
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          npm ci --prefix frontend

      - name: Run checked-in contract gates
        run: python scripts/run_quality_gate.py contracts

      - name: Validate GitHub workflows
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          --workdir /repo
          docker.io/rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          -color

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up locked Python
        uses: ./.github/actions/setup-python

      - name: Set up locked Node.js
        uses: ./.github/actions/setup-node

      - name: Reproduce quality dependencies
        run: |
          uv lock --check
          uv sync --frozen --all-packages --all-extras
          uv pip check
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          npm ci --prefix frontend

      - name: Run checked-in lint gates
        run: python scripts/run_quality_gate.py lint

  typecheck:
    name: Types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up locked Python
        uses: ./.github/actions/setup-python

      - name: Set up locked Node.js
        uses: ./.github/actions/setup-node

      - name: Reproduce type-check dependencies
        run: |
          uv lock --check
          uv sync --frozen --all-packages --all-extras
          uv pip check
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          npm ci --prefix frontend

      - name: Run checked-in type gates
        run: python scripts/run_quality_gate.py types

  backend:
    name: Backend unit and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@localhost:5432/recipe_lab_test
      TEST_DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@localhost:5432/recipe_lab_test
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
        env:
          POSTGRES_DB: recipe_lab_test
          POSTGRES_USER: recipe_lab
          POSTGRES_PASSWORD: recipe_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_lab -d recipe_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up locked Python
        uses: ./.github/actions/setup-python

      - name: Install backend dependencies
        run: |
          uv lock --check
          uv sync --frozen --package recipe-lab-api --extra dev
          uv pip check
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Run checked-in backend gate
        run: python ../scripts/run_quality_gate.py backend

  frontend:
    name: Frontend unit and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up locked Node.js
        uses: ./.github/actions/setup-node

      - name: Install frontend dependencies
        run: npm ci

      - name: Run checked-in frontend gate
        run: npm run ci:verify

  rcp34b-baselines:
    name: RCP-34B deterministic baselines
    # Playwright 1.62.1 on Ubuntu 24.04 (Noble), pinned to the linux/amd64
    # manifest published at mcr.microsoft.com/playwright:v1.62.1-noble.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
      options: --ipc=host
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up locked Node.js
        uses: ./.github/actions/setup-node

      - name: Install exact frontend dependencies
        run: npm ci

      - name: Verify pinned Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          test "$(npx --no-install playwright --version)" = "Version 1.62.1"
          browser_version="$(node - <<'NODE'
          const { chromium } = require("@playwright/test");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            process.stdout.write(browser.version());
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          )"
          test "$browser_version" = "151.0.7922.34"

      - name: Compare deterministic visual and accessibility baselines twice
        run: npm run test:e2e:baseline -- --repeat-each=2

      - name: Upload public baseline aggregate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rcp34b-public-baseline-aggregate
          path: frontend/test-results/baseline/results.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload sanitized visual differences
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rcp34b-sanitized-visual-differences
          path: |
            frontend/test-results/baseline/artifacts/**/*-actual.png
            frontend/test-results/baseline/artifacts/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 7

  production-images:
    name: Production images
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BACKEND_IMAGE: recipe-lab-backend:rcp33d-${{ github.sha }}
      FRONTEND_IMAGE: recipe-lab-frontend:rcp33d-${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up locked Python
        uses: ./.github/actions/setup-python

      - name: Reproduce locked Python environment
        run: |
          uv lock --check
          uv sync --frozen --package recipe-lab-api
          uv pip check
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Test production image verifier
        run: python -m unittest scripts.tests.test_verify_production_images

      - name: Build and smoke-test production images
        run: |
          python scripts/verify_production_images.py \
            --backend-image "$BACKEND_IMAGE" \
            --frontend-image "$FRONTEND_IMAGE" \
            --backend-context . \
            --backend-dockerfile backend/Dockerfile \
            --frontend-context frontend \
            --frontend-dockerfile frontend/Dockerfile

      - name: Remove local production images
        if: always()
        run: docker image rm --force "$BACKEND_IMAGE" "$FRONTEND_IMAGE" > /dev/null 2>&1 || true

  source-package:
    name: Safe source package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up locked Python
        uses: ./.github/actions/setup-python

      - name: Reproduce locked Python environment
        run: |
          uv lock --check
          uv sync --frozen --package recipe-lab-api
          uv pip check
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Test fail-closed source packaging
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Audit reviewed opaque source objects
        run: python scripts/package_source.py --ref "$GITHUB_SHA" --audit-opaque-policy

      - name: Verify deterministic committed-source output
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/recipe-lab-source-first.zip"
          second="$RUNNER_TEMP/recipe-lab-source-second.zip"
          python scripts/package_source.py \
            --ref "$GITHUB_SHA" \
            --output "$first" \
            > "$RUNNER_TEMP/recipe-lab-source-first-report.json"
          python scripts/package_source.py \
            --ref "$GITHUB_SHA" \
            --output "$second" \
            > "$RUNNER_TEMP/recipe-lab-source-second-report.json"
          cmp --silent "$first" "$second"
          cmp --silent \
            "$first.manifest.json" \
            "$second.manifest.json"
          cmp --silent \
            "$RUNNER_TEMP/recipe-lab-source-first-report.json" \
            "$RUNNER_TEMP/recipe-lab-source-second-report.json"

      - name: Remove source package outputs
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f -- \
            "$RUNNER_TEMP/recipe-lab-source-first.zip" \
            "$RUNNER_TEMP/recipe-lab-source-first.zip.manifest.json" \
            "$RUNNER_TEMP/recipe-lab-source-first-report.json" \
            "$RUNNER_TEMP/recipe-lab-source-second.zip" \
            "$RUNNER_TEMP/recipe-lab-source-second.zip.manifest.json" \
            "$RUNNER_TEMP/recipe-lab-source-second-report.json"

  offline-evaluation:
    name: Offline evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@localhost:5432/recipe_lab_evaluation_test
      TEST_DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@localhost:5432/recipe_lab_evaluation_test
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
        env:
          POSTGRES_DB: recipe_lab_evaluation_test
          POSTGRES_USER: recipe_lab
          POSTGRES_PASSWORD: recipe_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_lab -d recipe_lab_evaluation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ml

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up locked Python
        uses: ./.github/actions/setup-python

      - name: Install evaluation dependencies
        run: |
          uv lock --check
          uv sync --frozen --package recipe-lab-evaluation --extra dev
          uv pip check
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Apply evaluation database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Test evaluation package
        run: python ../scripts/run_quality_gate.py ml

      - name: Verify byte-identical evaluation reports
        shell: bash
        run: |
          recipe-lab-eval run \
            --snapshot tests/fixtures/synthetic_snapshot_v2.json \
            --k 5 --k 10 --seed 20260821 \
            --output "$RUNNER_TEMP/evaluation-report-a.json"
          recipe-lab-eval run \
            --snapshot tests/fixtures/synthetic_snapshot_v2.json \
            --k 10 --k 5 --seed 20260821 \
            --output "$RUNNER_TEMP/evaluation-report-b.json"
          cmp "$RUNNER_TEMP/evaluation-report-a.json" \
            "$RUNNER_TEMP/evaluation-report-b.json"

      - name: Verify collaborative-readiness reproducibility
        shell: bash
        run: |
          recipe-lab-eval simulate \
            --catalog tests/fixtures/readiness_catalog_v2.json \
            --profiles 64 --seed 20260822 \
            --output "$RUNNER_TEMP/readiness-snapshot-a.json"
          recipe-lab-eval simulate \
            --catalog tests/fixtures/readiness_catalog_v2.json \
            --profiles 64 --seed 20260822 \
            --output "$RUNNER_TEMP/readiness-snapshot-b.json"
          cmp "$RUNNER_TEMP/readiness-snapshot-a.json" \
            "$RUNNER_TEMP/readiness-snapshot-b.json"
          recipe-lab-eval simulate \
            --catalog tests/fixtures/readiness_catalog_v2.json \
            --profiles 64 --seed 20260823 \
            --output "$RUNNER_TEMP/readiness-snapshot-c.json"
          if cmp -s "$RUNNER_TEMP/readiness-snapshot-a.json" \
            "$RUNNER_TEMP/readiness-snapshot-c.json"; then
            echo "Different simulator seeds produced identical snapshots"
            exit 1
          fi
          recipe-lab-eval readiness \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-a.json" \
            --output "$RUNNER_TEMP/readiness-report-a.json" --strict
          recipe-lab-eval readiness \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-b.json" \
            --output "$RUNNER_TEMP/readiness-report-b.json" --strict
          recipe-lab-eval readiness \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-c.json" \
            --output "$RUNNER_TEMP/readiness-report-c.json" --strict
          cmp "$RUNNER_TEMP/readiness-report-a.json" \
            "$RUNNER_TEMP/readiness-report-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "readiness-report-a.json").read_text()
          )
          assert report["schema_version"] == (
              "recipe-lab-collaborative-readiness-report-v2"
          )
          assert report["protocol_version"] == (
              "fixed-cutoff-collaborative-readiness-v2"
          )
          assert report["counts"]["collaborative_evidence"][
              "profiles_with_usable_candidate_evidence"
          ] == 64
          PY

      - name: Evaluate collaborative model on ready data
        shell: bash
        run: |
          recipe-lab-eval run \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-a.json" \
            --collaborative --k 1 --k 3 --seed 20260822 --strict \
            --output "$RUNNER_TEMP/collaborative-report-a.json"
          recipe-lab-eval run \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-b.json" \
            --collaborative --k 3 --k 1 --seed 20260822 --strict \
            --output "$RUNNER_TEMP/collaborative-report-b.json"
          cmp "$RUNNER_TEMP/collaborative-report-a.json" \
            "$RUNNER_TEMP/collaborative-report-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "collaborative-report-a.json").read_text()
          )
          assert report["status"] == "complete"
          assert report["schema_version"] == "recipe-lab-offline-evaluation-report-v3"
          assert report["protocol_version"] == "fixed-cutoff-full-catalog-v1"
          assert report["hybrid_adoption"] is None
          assert [model["model_id"] for model in report["models"]] == [
              "baseline-v1",
              "collaborative-v1",
              "content-v1",
          ]
          collaborative = report["models"][1]
          assert collaborative["artifact"]["artifact_schema_version"] == (
              "recipe-lab-collaborative-artifact-v1"
          )
          assert all(metric["ndcg"] is not None for metric in collaborative["metrics"])
          assert all(metric["coverage"] is not None for metric in collaborative["metrics"])
          PY

      - name: Evaluate hybrid model and adoption policy on ready data
        shell: bash
        run: |
          recipe-lab-eval run \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-a.json" \
            --hybrid --k 1 --k 3 --seed 20260822 --strict \
            --output "$RUNNER_TEMP/hybrid-report-a.json"
          recipe-lab-eval run \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-b.json" \
            --hybrid --k 3 --k 1 --seed 20260822 --strict \
            --output "$RUNNER_TEMP/hybrid-report-b.json"
          cmp "$RUNNER_TEMP/hybrid-report-a.json" \
            "$RUNNER_TEMP/hybrid-report-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "hybrid-report-a.json").read_text()
          )
          assert report["status"] == "complete"
          assert report["schema_version"] == "recipe-lab-offline-evaluation-report-v3"
          assert report["protocol_version"] == "fixed-cutoff-full-catalog-v1"
          assert [model["model_id"] for model in report["models"]] == [
              "baseline-v1",
              "collaborative-v1",
              "content-v1",
              "hybrid-v1",
          ]

          hybrid = report["models"][3]
          assert hybrid["artifact"] is None
          assert hybrid["metrics"] == [
              {
                  "coverage": "0.875000",
                  "k": 1,
                  "mean_candidate_popularity": "1.000000",
                  "mean_recommended_popularity": "1.000000",
                  "ndcg": "0.718750",
                  "popularity_bias": "0.000000",
                  "precision": "0.718750",
                  "recall": "0.359375",
                  "support": {"evaluated_users": 64, "relevant_items": 128},
              },
              {
                  "coverage": "1.000000",
                  "k": 3,
                  "mean_candidate_popularity": "1.000000",
                  "mean_recommended_popularity": "1.000000",
                  "ndcg": "0.887435",
                  "popularity_bias": "0.000000",
                  "precision": "0.666667",
                  "recall": "1.000000",
                  "support": {"evaluated_users": 64, "relevant_items": 128},
              },
          ]

          decision = report["hybrid_adoption"]
          assert decision == {
              "candidate_model_id": "hybrid-v1",
              "comparisons": [
                  {
                      "coverage_delta": "0.250000",
                      "evaluated_users": 64,
                      "k": 1,
                      "ndcg_delta": "0.015625",
                      "recall_delta": "0.007812",
                      "reference_model_id": "baseline-v1",
                  },
                  {
                      "coverage_delta": "0.000000",
                      "evaluated_users": 64,
                      "k": 3,
                      "ndcg_delta": "0.001028",
                      "recall_delta": "0.000000",
                      "reference_model_id": "content-v1",
                  },
              ],
              "evaluated_users": 64,
              "policy": {
                  "maximum_coverage_regression": "0.050000",
                  "maximum_ndcg_regression": "0.000000",
                  "maximum_recall_regression": "0.000000",
                  "minimum_evaluated_users": 40,
                  "minimum_primary_ndcg_lift": "0.010000",
              },
              "policy_version": "hybrid-adoption-policy-v1",
              "primary_k": 3,
              "primary_ndcg_lift": "0.001028",
              "reason_codes": [
                  "synthetic_evidence_only",
                  "primary_ndcg_lift_below_minimum",
              ],
              "reference_model_id": "content-v1",
              "status": "retain_simpler",
              "worst_coverage_delta": "0.000000",
              "worst_ndcg_delta": "0.001028",
              "worst_recall_delta": "0.000000",
          }
          PY

      - name: Verify substitution rules report
        shell: bash
        run: |
          recipe-lab-eval substitution-run \
            --benchmark tests/fixtures/substitution_benchmark_v1.json \
            --output "$RUNNER_TEMP/substitution-report-a.json" --strict
          recipe-lab-eval substitution-run \
            --benchmark tests/fixtures/substitution_benchmark_v1.json \
            --output "$RUNNER_TEMP/substitution-report-b.json" --strict
          cmp "$RUNNER_TEMP/substitution-report-a.json" \
            "$RUNNER_TEMP/substitution-report-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "substitution-report-a.json").read_text()
          )
          assert set(report) == {
              "benchmark_sha256",
              "counts",
              "learned_ranking_attempted",
              "limitations",
              "metrics",
              "protocol_version",
              "reason_codes",
              "run_id",
              "schema_version",
              "status",
              "strategy",
          }
          assert report["schema_version"] == (
              "recipe-lab-substitution-evaluation-report-v1"
          )
          assert report["protocol_version"] == "curated-direct-rules-benchmark-v1"
          assert report["benchmark_sha256"] == (
              "a426af3fab31afc2b8a71b8d4d052b7ade1f703f14aef714112344a894b844f0"
          )
          assert report["run_id"] == (
              "f34b4160c45339e4fe36bc79a96a0b9e82ddd2badb070ca8da9bfdda24d7887d"
          )
          assert report["status"] == "engineering_validated"
          assert report["reason_codes"] == []
          assert report["strategy"] == "substitution-rules-v1"
          assert report["learned_ranking_attempted"] is False
          assert report["counts"] == {
              "allergen_filtered": 2,
              "cases": 6,
              "cases_with_expected_results": 5,
              "caution_mismatches": 0,
              "constraint_violations": 0,
              "dietary_filtered": 2,
              "direct_candidates_considered": 13,
              "eligible_candidates": 9,
              "empty_expected_cases": 1,
              "exact_ranking_matches": 6,
              "expected_candidates": 9,
              "matching_candidates": 9,
              "missing_explanations": 0,
              "missing_provenance_or_confidence": 0,
              "missing_ratio_or_guidance": 0,
              "non_direct_outputs": 0,
              "returned_candidates": 9,
              "top1_matches": 5,
          }
          assert report["metrics"] == {
              "candidate_recall": "1.000000",
              "caution_compliance": "1.000000",
              "constraint_compliance": "1.000000",
              "direct_edge_precision": "1.000000",
              "empty_result_accuracy": "1.000000",
              "exact_ranking_accuracy": "1.000000",
              "explanation_coverage": "1.000000",
              "provenance_or_confidence_coverage": "1.000000",
              "ratio_or_guidance_coverage": "1.000000",
              "top1_accuracy": "1.000000",
          }
          assert report["limitations"] == [
              (
