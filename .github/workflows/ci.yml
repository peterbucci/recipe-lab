  mvp-acceptance:
    name: MVP acceptance
    if: ${{ always() }}
    needs:
      - backend
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@127.0.0.1:5432/recipe_lab_acceptance
      CORS_ORIGINS: http://127.0.0.1:3000
      AUTH_ALLOWED_ORIGINS: http://127.0.0.1:3000
      RECIPE_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
      ACCEPTANCE_DATABASE_ISOLATED: "1"
      MVP_ACCEPTANCE: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start -- --hostname 127.0.0.1 --port 3000
      INTERNAL_NETWORK_SIGNAL_SECRET: recipe-lab-ci-internal-network-signal-secret
    services:
      postgres:
        # PostgreSQL 17.11 Alpine 3.24, pinned to the linux/amd64 manifest.
        image: postgres:17.11-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
        env:
          POSTGRES_DB: recipe_lab_acceptance
          POSTGRES_USER: recipe_lab
          POSTGRES_PASSWORD: recipe_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_lab -d recipe_lab_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Configure acceptance fixture path
        shell: bash
        run: |
          echo "ACCEPTANCE_SESSION_FIXTURE=$RUNNER_TEMP/recipe-lab-acceptance-sessions.json" \
            >> "$GITHUB_ENV"

      - name: Require backend and frontend quality gates
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [[ "$BACKEND_RESULT" != "success" || "$FRONTEND_RESULT" != "success" ]]; then
            echo "Backend quality: $BACKEND_RESULT"
            echo "Frontend quality: $FRONTEND_RESULT"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up locked Python
        uses: ./.github/actions/setup-python

      - name: Set up locked Node.js
        uses: ./.github/actions/setup-node

      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv lock --check
          uv sync --frozen --package recipe-lab-api
          uv pip check
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify pinned public performance runtimes
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          test "$(python --version 2>&1)" = "Python 3.13.15"
          test "$(node --version)" = "v22.23.2"
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          try:
              with engine.connect() as connection:
                  version = connection.scalar(text("SHOW server_version"))
              if version != "17.11":
                  raise SystemExit("The public performance database version is not pinned.")
          finally:
              engine.dispose()
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Migrate and seed acceptance database
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m app.seeds load

      - name: Provision isolated acceptance member, curator, and moderator sessions
        working-directory: backend
        run: python -m app.testing.acceptance_sessions

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start backend
        working-directory: backend
        shell: bash
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/recipe-lab-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/recipe-lab-backend.pid"

      - name: Wait for backend readiness
        run: >-
          python scripts/wait_for_services.py
          --timeout 30
          --service "backend=http://127.0.0.1:8000/api/health,$RUNNER_TEMP/recipe-lab-backend.pid"

      - name: Check public performance baseline
        working-directory: frontend
        env:
          RCP34B_PERFORMANCE: "1"
          RCP34B_PERFORMANCE_MODE: check
        run: npx --no-install playwright test e2e/public-performance-baseline.spec.ts --project=chromium

      - name: Run MVP browser acceptance suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Remove acceptance session fixture
        if: always()
        shell: bash
        run: rm -f -- "$ACCEPTANCE_SESSION_FIXTURE"

      - name: Upload acceptance diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mvp-acceptance-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/recipe-lab-backend.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/recipe-lab-backend.pid"; then
            kill "$(cat "$RUNNER_TEMP/recipe-lab-backend.pid")" 2>/dev/null || true
          fi

  rcp32-acceptance:
    name: RCP-32 acceptance
    if: ${{ always() }}
    needs:
      - backend
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@127.0.0.1:5432/recipe_lab_rcp32_acceptance
      CORS_ORIGINS: http://127.0.0.1:3100
      AUTH_ALLOWED_ORIGINS: http://127.0.0.1:3100
      APP_ENVIRONMENT: local
      OIDC_ISSUER: http://127.0.0.1:8200
      OIDC_CLIENT_ID: recipe-lab-rcp32
      OIDC_REDIRECT_URI: http://127.0.0.1:3100/api/auth/callback
      OIDC_SCOPES: openid email profile
      OIDC_ALLOWED_SIGNING_ALGORITHMS: RS256
      RECIPE_API_URL: http://127.0.0.1:8100
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8100
      NEXT_TELEMETRY_DISABLED: "1"
      RCP32_ACCEPTANCE: "1"
      ACCEPTANCE_DATABASE_ISOLATED: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      PLAYWRIGHT_WEB_SERVER_COMMAND: APP_ENVIRONMENT=production npm run start -- --hostname 127.0.0.1 --port 3100
      RCP32_PYTHON_EXECUTABLE: python
      RCP32_DATABASE_IMAGE: postgres:17.11-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
      ABUSE_RATE_LIMIT_SECRET: recipe-lab-rcp32-ci-rate-limit-secret-2026
      INTERNAL_NETWORK_SIGNAL_SECRET: recipe-lab-rcp32-ci-network-signal-secret-2026
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
        env:
          POSTGRES_DB: recipe_lab_rcp32_acceptance
          POSTGRES_USER: recipe_lab
          POSTGRES_PASSWORD: recipe_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_lab -d recipe_lab_rcp32_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Configure private runner paths
        shell: bash
        run: |
          {
            echo "RCP32_MANIFEST_PATH=$RUNNER_TEMP/recipe-lab-rcp32-manifest.json"
            echo "RCP32_BACKUP_PATH=$RUNNER_TEMP/recipe-lab-rcp32-backup.dump"
            echo "RCP32_SAFE_ARTIFACT_DIR=$RUNNER_TEMP/recipe-lab-rcp32-safe-summaries"
            echo "RCP32_BACKEND_LOG=$RUNNER_TEMP/recipe-lab-rcp32-backend.log"
            echo "RCP32_OIDC_LOG=$RUNNER_TEMP/recipe-lab-rcp32-oidc.log"
            echo "RCP32_BROWSER_LOG=$RUNNER_TEMP/recipe-lab-rcp32-browser.log"
          } >> "$GITHUB_ENV"

      - name: Require backend and frontend quality gates
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [[ "$BACKEND_RESULT" != "success" || "$FRONTEND_RESULT" != "success" ]]; then
            echo "Backend quality: $BACKEND_RESULT"
            echo "Frontend quality: $FRONTEND_RESULT"
            exit 1
          fi

      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up locked Python
        uses: ./.github/actions/setup-python

      - name: Set up locked Node.js
        uses: ./.github/actions/setup-node

      - name: Install backend release-gate harness
        id: install-backend
        working-directory: backend
        run: |
          uv lock --check
          uv sync --frozen --package recipe-lab-api
          uv pip check
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Prepare private runner paths
        shell: bash
        run: |
          umask 077
          install -d -m 0700 -- "$RCP32_SAFE_ARTIFACT_DIR"
          : > "$RCP32_BACKEND_LOG"
          : > "$RCP32_OIDC_LOG"
          : > "$RCP32_BROWSER_LOG"

      - name: Rehearse migrations, seed, and stage legacy demo evidence
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python -m alembic check
          python -m app.seeds load
          python -m app.testing.community_release_gate stage-demo-activity

      - name: Build the production frontend
        working-directory: frontend
        run: npm run build

      - name: Start guarded local identity provider
        working-directory: backend
        shell: bash
        run: |
          umask 077
          nohup python -m app.testing.local_oidc_provider \
            --host 127.0.0.1 \
            --port 8200 \
            > "$RCP32_OIDC_LOG" 2>&1 &
          echo $! > "$RUNNER_TEMP/recipe-lab-rcp32-oidc.pid"

      - name: Start backend without access logs
        working-directory: backend
        shell: bash
        run: |
          umask 077
          nohup python -m uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8100 \
            --no-access-log \
            > "$RCP32_BACKEND_LOG" 2>&1 &
          echo $! > "$RUNNER_TEMP/recipe-lab-rcp32-backend.pid"

      - name: Wait for isolated services
        run: >-
          python scripts/wait_for_services.py
          --timeout 45
          --service "identity-provider=http://127.0.0.1:8200/health,$RUNNER_TEMP/recipe-lab-rcp32-oidc.pid"
          --service "backend=http://127.0.0.1:8100/api/health,$RUNNER_TEMP/recipe-lab-rcp32-backend.pid"

      - name: Run only the community release-gate browser journey
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run test:e2e:release-gate > "$RCP32_BROWSER_LOG" 2>&1
          browser_result=$?
          set -e
          if [[ "$browser_result" != "0" ]]; then
            echo "The RCP-32 browser journey failed; private diagnostics were withheld."
            exit "$browser_result"
          fi

      - name: Verify live community evidence
        working-directory: backend
        shell: bash
        run: |
          umask 077
          python -m app.testing.community_release_gate \
            verify \
            --manifest "$RCP32_MANIFEST_PATH" \
            > "$RCP32_SAFE_ARTIFACT_DIR/live-database-summary.json"

      - name: Back up and restore into the allowlisted recovery database
        shell: bash
        run: |
          umask 077
          docker run --rm --network host \
            -e PGPASSWORD=recipe_lab \
            "$RCP32_DATABASE_IMAGE" \
            pg_dump \
              --host 127.0.0.1 \
              --username recipe_lab \
              --dbname recipe_lab_rcp32_acceptance \
              --format custom \
              --no-owner \
              --no-privileges \
            > "$RCP32_BACKUP_PATH"
          docker run --rm --network host \
            -e PGPASSWORD=recipe_lab \
            "$RCP32_DATABASE_IMAGE" \
            dropdb \
              --host 127.0.0.1 \
              --username recipe_lab \
              --if-exists \
              recipe_lab_rcp32_acceptance_restore
          docker run --rm --network host \
            -e PGPASSWORD=recipe_lab \
            "$RCP32_DATABASE_IMAGE" \
            createdb \
              --host 127.0.0.1 \
              --username recipe_lab \
              recipe_lab_rcp32_acceptance_restore
          docker run --rm --interactive --network host \
            -e PGPASSWORD=recipe_lab \
            "$RCP32_DATABASE_IMAGE" \
            pg_restore \
              --host 127.0.0.1 \
              --username recipe_lab \
              --dbname recipe_lab_rcp32_acceptance_restore \
              --exit-on-error \
              --no-owner \
              --no-privileges \
            < "$RCP32_BACKUP_PATH"

      - name: Verify restored community evidence
        working-directory: backend
        shell: bash
        env:
          DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@127.0.0.1:5432/recipe_lab_rcp32_acceptance_restore
        run: |
          umask 077
          python -m alembic check
          python -m app.testing.community_release_gate \
            verify \
            --manifest "$RCP32_MANIFEST_PATH" \
            > "$RCP32_SAFE_ARTIFACT_DIR/restored-database-summary.json"
          cmp --silent \
            "$RCP32_SAFE_ARTIFACT_DIR/live-database-summary.json" \
            "$RCP32_SAFE_ARTIFACT_DIR/restored-database-summary.json"

      - name: Scan release-gate logs, manifest, and summaries for private markers
        if: ${{ always() && steps.install-backend.outcome == 'success' }}
        working-directory: backend
        shell: bash
        run: |
          umask 077
          scan_paths=("$RCP32_SAFE_ARTIFACT_DIR")
          for path in \
            "$RCP32_BACKEND_LOG" \
            "$RCP32_OIDC_LOG" \
            "$RCP32_BROWSER_LOG" \
            "$RCP32_MANIFEST_PATH" \
            "$GITHUB_WORKSPACE/frontend/test-results" \
            "$GITHUB_WORKSPACE/frontend/playwright-report"; do
            if [[ -e "$path" ]]; then
              scan_paths+=("$path")
            fi
          done
          scan_summary="$RUNNER_TEMP/recipe-lab-rcp32-privacy-summary.json.tmp"
          python -m app.testing.community_release_gate \
            scan-artifacts \
            "${scan_paths[@]}" \
            > "$scan_summary"
          mv -- "$scan_summary" "$RCP32_SAFE_ARTIFACT_DIR/privacy-summary.json"

      - name: Remove private release-gate material and stop services
        if: always()
        shell: bash
        run: |
          set +e
          cleanup_result=0
          for pid_file in \
            "$RUNNER_TEMP/recipe-lab-rcp32-backend.pid" \
            "$RUNNER_TEMP/recipe-lab-rcp32-oidc.pid"; do
            if [[ -f "$pid_file" ]]; then
              if ! pid="$(cat "$pid_file")"; then
                cleanup_result=1
              elif [[ "$pid" =~ ^[0-9]+$ ]]; then
                kill "$pid" 2>/dev/null || true
              else
                cleanup_result=1
              fi
            fi
          done
          docker run --rm --network host \
            -e PGPASSWORD=recipe_lab \
            "$RCP32_DATABASE_IMAGE" \
            dropdb \
              --host 127.0.0.1 \
              --username recipe_lab \
              --force \
              --if-exists \
              recipe_lab_rcp32_acceptance_restore \
            > /dev/null 2>&1 || cleanup_result=1
          rm -f -- \
            "$RUNNER_TEMP/recipe-lab-rcp32-backend.pid" \
            "$RUNNER_TEMP/recipe-lab-rcp32-oidc.pid" \
            "$RUNNER_TEMP/recipe-lab-rcp32-privacy-summary.json.tmp" \
            "$RCP32_BACKEND_LOG" \
            "$RCP32_OIDC_LOG" \
            "$RCP32_BROWSER_LOG" \
            "$RCP32_MANIFEST_PATH" \
            "$RCP32_BACKUP_PATH" || cleanup_result=1
          find "$RUNNER_TEMP" \
            -maxdepth 1 \
            -type f \
            -name 'recipe-lab-rcp32-manifest.json.rcp32-*.tmp' \
            -delete || cleanup_result=1
          rm -rf -- \
            "$GITHUB_WORKSPACE/frontend/test-results" \
            "$GITHUB_WORKSPACE/frontend/playwright-report" || cleanup_result=1
          exit "$cleanup_result"

      - name: Upload privacy-safe community release summaries
        if: ${{ success() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rcp32-community-release-gate-summaries
          path: |
            ${{ runner.temp }}/recipe-lab-rcp32-safe-summaries/live-database-summary.json
            ${{ runner.temp }}/recipe-lab-rcp32-safe-summaries/restored-database-summary.json
            ${{ runner.temp }}/recipe-lab-rcp32-safe-summaries/privacy-summary.json
          if-no-files-found: error
          retention-days: 7

  rcp32-release-gate:
    name: RCP-32 community release gate
    if: ${{ always() }}
    # Backend quality owns bounded-body, abuse, rollback, idempotency, and concurrency proofs.
    # Offline evaluation is intentionally independent of the deployable community gate.
    needs:
      - backend
      - contracts
      - frontend
      - lint
      - mvp-acceptance
      - production-images
      - rcp34b-baselines
      - rcp32-acceptance
      - security
      - source-package
      - typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every deployable application gate
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          MVP_ACCEPTANCE_RESULT: ${{ needs.mvp-acceptance.result }}
          PRODUCTION_IMAGES_RESULT: ${{ needs.production-images.result }}
          RCP34B_BASELINES_RESULT: ${{ needs.rcp34b-baselines.result }}
          RCP32_ACCEPTANCE_RESULT: ${{ needs.rcp32-acceptance.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SOURCE_PACKAGE_RESULT: ${{ needs.source-package.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
        run: |
          if [[ "$BACKEND_RESULT" != "success" \
            || "$CONTRACTS_RESULT" != "success" \
            || "$FRONTEND_RESULT" != "success" \
            || "$LINT_RESULT" != "success" \
            || "$MVP_ACCEPTANCE_RESULT" != "success" \
            || "$PRODUCTION_IMAGES_RESULT" != "success" \
            || "$RCP34B_BASELINES_RESULT" != "success" \
            || "$RCP32_ACCEPTANCE_RESULT" != "success" \
            || "$SECURITY_RESULT" != "success" \
            || "$SOURCE_PACKAGE_RESULT" != "success" \
            || "$TYPECHECK_RESULT" != "success" ]]; then
            echo "Backend quality: $BACKEND_RESULT"
            echo "Contracts: $CONTRACTS_RESULT"
            echo "Frontend quality: $FRONTEND_RESULT"
            echo "Lint: $LINT_RESULT"
            echo "MVP acceptance: $MVP_ACCEPTANCE_RESULT"
            echo "Production images: $PRODUCTION_IMAGES_RESULT"
            echo "RCP-34B deterministic baselines: $RCP34B_BASELINES_RESULT"
            echo "RCP-32 acceptance: $RCP32_ACCEPTANCE_RESULT"
            echo "Security: $SECURITY_RESULT"
            echo "Safe source package: $SOURCE_PACKAGE_RESULT"
            echo "Types: $TYPECHECK_RESULT"
            exit 1
          fi

  unit:
    name: Unit
    if: ${{ always() }}
    needs:
      - backend
      - frontend
      - offline-evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every package test suite
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          ML_RESULT: ${{ needs.offline-evaluation.result }}
        run: |
          for result in "$BACKEND_RESULT" "$FRONTEND_RESULT" "$ML_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A package test suite did not pass."
              exit 1
            fi
          done

  integration:
    name: Integration
    if: ${{ always() }}
    needs:
      - backend
      - offline-evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require database and deterministic evaluation checks
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          ML_RESULT: ${{ needs.offline-evaluation.result }}
        run: |
          if [[ "$BACKEND_RESULT" != "success" || "$ML_RESULT" != "success" ]]; then
            echo "A database-backed integration suite did not pass."
            exit 1
          fi

  build:
    name: Build
    if: ${{ always() }}
    needs:
      - frontend
      - production-images
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require frontend and production image builds
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          IMAGES_RESULT: ${{ needs.production-images.result }}
        run: |
          if [[ "$FRONTEND_RESULT" != "success" || "$IMAGES_RESULT" != "success" ]]; then
            echo "A production build did not pass."
            exit 1
          fi

  e2e:
    name: E2E
    if: ${{ always() }}
    needs:
      - mvp-acceptance
      - rcp32-acceptance
      - rcp34b-baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require browser and visual acceptance suites
        env:
          MVP_RESULT: ${{ needs.mvp-acceptance.result }}
          RCP32_RESULT: ${{ needs.rcp32-acceptance.result }}
          VISUAL_RESULT: ${{ needs.rcp34b-baselines.result }}
        run: |
          for result in "$MVP_RESULT" "$RCP32_RESULT" "$VISUAL_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A browser or visual acceptance suite did not pass."
              exit 1
            fi
          done

  repository-quality:
    name: Repository quality
    if: ${{ always() }}
    needs:
      - build
      - contracts
      - e2e
      - integration
      - lint
      - rcp32-release-gate
      - security
      - source-package
      - typecheck
      - unit
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every stable quality gate
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          RELEASE_RESULT: ${{ needs.rcp32-release-gate.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SOURCE_RESULT: ${{ needs.source-package.result }}
          TYPES_RESULT: ${{ needs.typecheck.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          for result in \
            "$BUILD_RESULT" \
            "$CONTRACTS_RESULT" \
            "$E2E_RESULT" \
            "$INTEGRATION_RESULT" \
            "$LINT_RESULT" \
            "$RELEASE_RESULT" \
            "$SECURITY_RESULT" \
            "$SOURCE_RESULT" \
            "$TYPES_RESULT" \
            "$UNIT_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required repository quality gate did not pass."
              exit 1
            fi
          done
