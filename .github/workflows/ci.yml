name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@localhost:5432/recipe_lab_test
      TEST_DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@localhost:5432/recipe_lab_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recipe_lab_test
          POSTGRES_USER: recipe_lab
          POSTGRES_PASSWORD: recipe_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_lab -d recipe_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check backend formatting
        run: python -m ruff format --check .

      - name: Lint backend
        run: python -m ruff check --output-format=github .

      - name: Type-check backend
        run: python -m mypy app migrations tests

      - name: Validate bundled seed catalog
        run: python -m app.seeds validate

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Check migration completeness
        run: python -m alembic check

      - name: Test backend
        run: python -m pytest

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Validate Playwright configuration
        run: npx playwright test --list

  offline-evaluation:
    name: Offline evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ml

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            ml/pyproject.toml

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../backend -e ".[dev]"

      - name: Check evaluation formatting
        run: python -m ruff format --check src tests

      - name: Lint evaluation package
        run: python -m ruff check --output-format=github src tests

      - name: Type-check evaluation package
        run: python -m mypy src tests

      - name: Test evaluation package
        run: python -m pytest

      - name: Verify byte-identical evaluation reports
        shell: bash
        run: |
          recipe-lab-eval run \
            --snapshot tests/fixtures/synthetic_snapshot_v1.json \
            --k 5 --k 10 --seed 20260821 \
            --output "$RUNNER_TEMP/evaluation-report-a.json"
          recipe-lab-eval run \
            --snapshot tests/fixtures/synthetic_snapshot_v1.json \
            --k 10 --k 5 --seed 20260821 \
            --output "$RUNNER_TEMP/evaluation-report-b.json"
          cmp "$RUNNER_TEMP/evaluation-report-a.json" \
            "$RUNNER_TEMP/evaluation-report-b.json"

      - name: Verify collaborative-readiness reproducibility
        shell: bash
        run: |
          recipe-lab-eval simulate \
            --catalog tests/fixtures/readiness_catalog_v1.json \
            --profiles 64 --seed 20260822 \
            --output "$RUNNER_TEMP/readiness-snapshot-a.json"
          recipe-lab-eval simulate \
            --catalog tests/fixtures/readiness_catalog_v1.json \
            --profiles 64 --seed 20260822 \
            --output "$RUNNER_TEMP/readiness-snapshot-b.json"
          cmp "$RUNNER_TEMP/readiness-snapshot-a.json" \
            "$RUNNER_TEMP/readiness-snapshot-b.json"
          recipe-lab-eval simulate \
            --catalog tests/fixtures/readiness_catalog_v1.json \
            --profiles 64 --seed 20260823 \
            --output "$RUNNER_TEMP/readiness-snapshot-c.json"
          if cmp -s "$RUNNER_TEMP/readiness-snapshot-a.json" \
            "$RUNNER_TEMP/readiness-snapshot-c.json"; then
            echo "Different simulator seeds produced identical snapshots"
            exit 1
          fi
          recipe-lab-eval readiness \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-a.json" \
            --output "$RUNNER_TEMP/readiness-report-a.json" --strict
          recipe-lab-eval readiness \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-b.json" \
            --output "$RUNNER_TEMP/readiness-report-b.json" --strict
          recipe-lab-eval readiness \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-c.json" \
            --output "$RUNNER_TEMP/readiness-report-c.json" --strict
          cmp "$RUNNER_TEMP/readiness-report-a.json" \
            "$RUNNER_TEMP/readiness-report-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "readiness-report-a.json").read_text()
          )
          assert report["schema_version"] == (
              "recipe-lab-collaborative-readiness-report-v2"
          )
          assert report["protocol_version"] == (
              "fixed-cutoff-collaborative-readiness-v2"
          )
          assert report["counts"]["collaborative_evidence"][
              "profiles_with_usable_candidate_evidence"
          ] == 64
          PY

      - name: Evaluate collaborative model on ready data
        shell: bash
        run: |
          recipe-lab-eval run \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-a.json" \
            --collaborative --k 1 --k 3 --seed 20260822 --strict \
            --output "$RUNNER_TEMP/collaborative-report-a.json"
          recipe-lab-eval run \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-b.json" \
            --collaborative --k 3 --k 1 --seed 20260822 --strict \
            --output "$RUNNER_TEMP/collaborative-report-b.json"
          cmp "$RUNNER_TEMP/collaborative-report-a.json" \
            "$RUNNER_TEMP/collaborative-report-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "collaborative-report-a.json").read_text()
          )
          assert report["status"] == "complete"
          assert report["schema_version"] == "recipe-lab-offline-evaluation-report-v2"
          assert report["protocol_version"] == "fixed-cutoff-full-catalog-v1"
          assert [model["model_id"] for model in report["models"]] == [
              "baseline-v1",
              "collaborative-v1",
              "content-v1",
          ]
          collaborative = report["models"][1]
          assert collaborative["artifact"]["artifact_schema_version"] == (
              "recipe-lab-collaborative-artifact-v1"
          )
          assert all(metric["ndcg"] is not None for metric in collaborative["metrics"])
          assert all(metric["coverage"] is not None for metric in collaborative["metrics"])
          PY

      - name: Upload reproducibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: offline-evaluation-report
          path: |
            ${{ runner.temp }}/evaluation-report-a.json
            ${{ runner.temp }}/readiness-report-a.json
            ${{ runner.temp }}/collaborative-report-a.json
          if-no-files-found: ignore
          retention-days: 7

  mvp-acceptance:
    name: MVP acceptance
    if: ${{ always() }}
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@127.0.0.1:5432/recipe_lab_acceptance
      CORS_ORIGINS: http://127.0.0.1:3000
      RECIPE_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
      ACCEPTANCE_DATABASE_ISOLATED: "1"
      MVP_ACCEPTANCE: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start -- --hostname 127.0.0.1 --port 3000
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recipe_lab_acceptance
          POSTGRES_USER: recipe_lab
          POSTGRES_PASSWORD: recipe_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_lab -d recipe_lab_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Require backend and frontend quality gates
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [[ "$BACKEND_RESULT" != "success" || "$FRONTEND_RESULT" != "success" ]]; then
            echo "Backend quality: $BACKEND_RESULT"
            echo "Frontend quality: $FRONTEND_RESULT"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Migrate and seed acceptance database
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m app.seeds load

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start backend
        working-directory: backend
        shell: bash
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/recipe-lab-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/recipe-lab-backend.pid"

      - name: Wait for backend readiness
        shell: bash
        run: |
          backend_pid="$(cat "$RUNNER_TEMP/recipe-lab-backend.pid")"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/recipe-lab-backend.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/recipe-lab-backend.log"
          exit 1

      - name: Run MVP browser acceptance suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload acceptance diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: mvp-acceptance-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/recipe-lab-backend.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/recipe-lab-backend.pid"; then
            kill "$(cat "$RUNNER_TEMP/recipe-lab-backend.pid")" 2>/dev/null || true
          fi
