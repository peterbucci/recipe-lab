name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@localhost:5432/recipe_lab_test
      TEST_DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@localhost:5432/recipe_lab_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recipe_lab_test
          POSTGRES_USER: recipe_lab
          POSTGRES_PASSWORD: recipe_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_lab -d recipe_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up locked Python resolver
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install backend dependencies
        run: |
          uv lock --check
          uv sync --frozen --package recipe-lab-api --extra dev
          uv pip check
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check backend formatting
        run: python -m ruff format --check .

      - name: Lint backend
        run: python -m ruff check --output-format=github .

      - name: Type-check backend
        run: python -m mypy app migrations tests

      - name: Check backend API contract drift
        run: python -m app.openapi_contract check

      - name: Validate bundled seed catalog
        run: python -m app.seeds validate

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Check migration completeness
        run: python -m alembic check

      - name: Test backend
        run: python -m pytest

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Validate Playwright configuration
        run: npx playwright test --list

  production-images:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BACKEND_IMAGE: recipe-lab-backend:rcp33d-${{ github.sha }}
      FRONTEND_IMAGE: recipe-lab-frontend:rcp33d-${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up locked Python resolver
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Reproduce locked Python environment
        run: |
          uv lock --check
          uv sync --frozen --package recipe-lab-api
          uv pip check
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Test production image verifier
        run: python -m unittest scripts.tests.test_verify_production_images

      - name: Build and smoke-test production images
        run: |
          python scripts/verify_production_images.py \
            --backend-image "$BACKEND_IMAGE" \
            --frontend-image "$FRONTEND_IMAGE" \
            --backend-context . \
            --backend-dockerfile backend/Dockerfile \
            --frontend-context frontend \
            --frontend-dockerfile frontend/Dockerfile

      - name: Remove local production images
        if: always()
        run: docker image rm --force "$BACKEND_IMAGE" "$FRONTEND_IMAGE" > /dev/null 2>&1 || true

  source-package:
    name: Safe source package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up locked Python resolver
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Reproduce locked Python environment
        run: |
          uv lock --check
          uv sync --frozen --package recipe-lab-api
          uv pip check
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Test fail-closed source packaging
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Verify deterministic committed-source output
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/recipe-lab-source-first.zip"
          second="$RUNNER_TEMP/recipe-lab-source-second.zip"
          python scripts/package_source.py \
            --ref "$GITHUB_SHA" \
            --output "$first" \
            > "$RUNNER_TEMP/recipe-lab-source-first-report.json"
          python scripts/package_source.py \
            --ref "$GITHUB_SHA" \
            --output "$second" \
            > "$RUNNER_TEMP/recipe-lab-source-second-report.json"
          cmp --silent "$first" "$second"
          cmp --silent \
            "$first.manifest.json" \
            "$second.manifest.json"
          cmp --silent \
            "$RUNNER_TEMP/recipe-lab-source-first-report.json" \
            "$RUNNER_TEMP/recipe-lab-source-second-report.json"

      - name: Remove source package outputs
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f -- \
            "$RUNNER_TEMP/recipe-lab-source-first.zip" \
            "$RUNNER_TEMP/recipe-lab-source-first.zip.manifest.json" \
            "$RUNNER_TEMP/recipe-lab-source-first-report.json" \
            "$RUNNER_TEMP/recipe-lab-source-second.zip" \
            "$RUNNER_TEMP/recipe-lab-source-second.zip.manifest.json" \
            "$RUNNER_TEMP/recipe-lab-source-second-report.json"

  offline-evaluation:
    name: Offline evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@localhost:5432/recipe_lab_evaluation_test
      TEST_DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@localhost:5432/recipe_lab_evaluation_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recipe_lab_evaluation_test
          POSTGRES_USER: recipe_lab
          POSTGRES_PASSWORD: recipe_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_lab -d recipe_lab_evaluation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ml

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up locked Python resolver
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install evaluation dependencies
        run: |
          uv lock --check
          uv sync --frozen --package recipe-lab-evaluation --extra dev
          uv pip check
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Apply evaluation database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Check evaluation formatting
        run: python -m ruff format --check src tests

      - name: Lint evaluation package
        run: python -m ruff check --output-format=github src tests

      - name: Type-check evaluation package
        run: python -m mypy src tests

      - name: Test evaluation package
        run: python -m pytest

      - name: Verify byte-identical evaluation reports
        shell: bash
        run: |
          recipe-lab-eval run \
            --snapshot tests/fixtures/synthetic_snapshot_v2.json \
            --k 5 --k 10 --seed 20260821 \
            --output "$RUNNER_TEMP/evaluation-report-a.json"
          recipe-lab-eval run \
            --snapshot tests/fixtures/synthetic_snapshot_v2.json \
            --k 10 --k 5 --seed 20260821 \
            --output "$RUNNER_TEMP/evaluation-report-b.json"
          cmp "$RUNNER_TEMP/evaluation-report-a.json" \
            "$RUNNER_TEMP/evaluation-report-b.json"

      - name: Verify collaborative-readiness reproducibility
        shell: bash
        run: |
          recipe-lab-eval simulate \
            --catalog tests/fixtures/readiness_catalog_v2.json \
            --profiles 64 --seed 20260822 \
            --output "$RUNNER_TEMP/readiness-snapshot-a.json"
          recipe-lab-eval simulate \
            --catalog tests/fixtures/readiness_catalog_v2.json \
            --profiles 64 --seed 20260822 \
            --output "$RUNNER_TEMP/readiness-snapshot-b.json"
          cmp "$RUNNER_TEMP/readiness-snapshot-a.json" \
            "$RUNNER_TEMP/readiness-snapshot-b.json"
          recipe-lab-eval simulate \
            --catalog tests/fixtures/readiness_catalog_v2.json \
            --profiles 64 --seed 20260823 \
            --output "$RUNNER_TEMP/readiness-snapshot-c.json"
          if cmp -s "$RUNNER_TEMP/readiness-snapshot-a.json" \
            "$RUNNER_TEMP/readiness-snapshot-c.json"; then
            echo "Different simulator seeds produced identical snapshots"
            exit 1
          fi
          recipe-lab-eval readiness \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-a.json" \
            --output "$RUNNER_TEMP/readiness-report-a.json" --strict
          recipe-lab-eval readiness \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-b.json" \
            --output "$RUNNER_TEMP/readiness-report-b.json" --strict
          recipe-lab-eval readiness \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-c.json" \
            --output "$RUNNER_TEMP/readiness-report-c.json" --strict
          cmp "$RUNNER_TEMP/readiness-report-a.json" \
            "$RUNNER_TEMP/readiness-report-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "readiness-report-a.json").read_text()
          )
          assert report["schema_version"] == (
              "recipe-lab-collaborative-readiness-report-v2"
          )
          assert report["protocol_version"] == (
              "fixed-cutoff-collaborative-readiness-v2"
          )
          assert report["counts"]["collaborative_evidence"][
              "profiles_with_usable_candidate_evidence"
          ] == 64
          PY

      - name: Evaluate collaborative model on ready data
        shell: bash
        run: |
          recipe-lab-eval run \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-a.json" \
            --collaborative --k 1 --k 3 --seed 20260822 --strict \
            --output "$RUNNER_TEMP/collaborative-report-a.json"
          recipe-lab-eval run \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-b.json" \
            --collaborative --k 3 --k 1 --seed 20260822 --strict \
            --output "$RUNNER_TEMP/collaborative-report-b.json"
          cmp "$RUNNER_TEMP/collaborative-report-a.json" \
            "$RUNNER_TEMP/collaborative-report-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "collaborative-report-a.json").read_text()
          )
          assert report["status"] == "complete"
          assert report["schema_version"] == "recipe-lab-offline-evaluation-report-v3"
          assert report["protocol_version"] == "fixed-cutoff-full-catalog-v1"
          assert report["hybrid_adoption"] is None
          assert [model["model_id"] for model in report["models"]] == [
              "baseline-v1",
              "collaborative-v1",
              "content-v1",
          ]
          collaborative = report["models"][1]
          assert collaborative["artifact"]["artifact_schema_version"] == (
              "recipe-lab-collaborative-artifact-v1"
          )
          assert all(metric["ndcg"] is not None for metric in collaborative["metrics"])
          assert all(metric["coverage"] is not None for metric in collaborative["metrics"])
          PY

      - name: Evaluate hybrid model and adoption policy on ready data
        shell: bash
        run: |
          recipe-lab-eval run \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-a.json" \
            --hybrid --k 1 --k 3 --seed 20260822 --strict \
            --output "$RUNNER_TEMP/hybrid-report-a.json"
          recipe-lab-eval run \
            --snapshot "$RUNNER_TEMP/readiness-snapshot-b.json" \
            --hybrid --k 3 --k 1 --seed 20260822 --strict \
            --output "$RUNNER_TEMP/hybrid-report-b.json"
          cmp "$RUNNER_TEMP/hybrid-report-a.json" \
            "$RUNNER_TEMP/hybrid-report-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "hybrid-report-a.json").read_text()
          )
          assert report["status"] == "complete"
          assert report["schema_version"] == "recipe-lab-offline-evaluation-report-v3"
          assert report["protocol_version"] == "fixed-cutoff-full-catalog-v1"
          assert [model["model_id"] for model in report["models"]] == [
              "baseline-v1",
              "collaborative-v1",
              "content-v1",
              "hybrid-v1",
          ]

          hybrid = report["models"][3]
          assert hybrid["artifact"] is None
          assert hybrid["metrics"] == [
              {
                  "coverage": "0.875000",
                  "k": 1,
                  "mean_candidate_popularity": "1.000000",
                  "mean_recommended_popularity": "1.000000",
                  "ndcg": "0.718750",
                  "popularity_bias": "0.000000",
                  "precision": "0.718750",
                  "recall": "0.359375",
                  "support": {"evaluated_users": 64, "relevant_items": 128},
              },
              {
                  "coverage": "1.000000",
                  "k": 3,
                  "mean_candidate_popularity": "1.000000",
                  "mean_recommended_popularity": "1.000000",
                  "ndcg": "0.887435",
                  "popularity_bias": "0.000000",
                  "precision": "0.666667",
                  "recall": "1.000000",
                  "support": {"evaluated_users": 64, "relevant_items": 128},
              },
          ]

          decision = report["hybrid_adoption"]
          assert decision == {
              "candidate_model_id": "hybrid-v1",
              "comparisons": [
                  {
                      "coverage_delta": "0.250000",
                      "evaluated_users": 64,
                      "k": 1,
                      "ndcg_delta": "0.015625",
                      "recall_delta": "0.007812",
                      "reference_model_id": "baseline-v1",
                  },
                  {
                      "coverage_delta": "0.000000",
                      "evaluated_users": 64,
                      "k": 3,
                      "ndcg_delta": "0.001028",
                      "recall_delta": "0.000000",
                      "reference_model_id": "content-v1",
                  },
              ],
              "evaluated_users": 64,
              "policy": {
                  "maximum_coverage_regression": "0.050000",
                  "maximum_ndcg_regression": "0.000000",
                  "maximum_recall_regression": "0.000000",
                  "minimum_evaluated_users": 40,
                  "minimum_primary_ndcg_lift": "0.010000",
              },
              "policy_version": "hybrid-adoption-policy-v1",
              "primary_k": 3,
              "primary_ndcg_lift": "0.001028",
              "reason_codes": [
                  "synthetic_evidence_only",
                  "primary_ndcg_lift_below_minimum",
              ],
              "reference_model_id": "content-v1",
              "status": "retain_simpler",
              "worst_coverage_delta": "0.000000",
              "worst_ndcg_delta": "0.001028",
              "worst_recall_delta": "0.000000",
          }
          PY

      - name: Verify substitution rules report
        shell: bash
        run: |
          recipe-lab-eval substitution-run \
            --benchmark tests/fixtures/substitution_benchmark_v1.json \
            --output "$RUNNER_TEMP/substitution-report-a.json" --strict
          recipe-lab-eval substitution-run \
            --benchmark tests/fixtures/substitution_benchmark_v1.json \
            --output "$RUNNER_TEMP/substitution-report-b.json" --strict
          cmp "$RUNNER_TEMP/substitution-report-a.json" \
            "$RUNNER_TEMP/substitution-report-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "substitution-report-a.json").read_text()
          )
          assert set(report) == {
              "benchmark_sha256",
              "counts",
              "learned_ranking_attempted",
              "limitations",
              "metrics",
              "protocol_version",
              "reason_codes",
              "run_id",
              "schema_version",
              "status",
              "strategy",
          }
          assert report["schema_version"] == (
              "recipe-lab-substitution-evaluation-report-v1"
          )
          assert report["protocol_version"] == "curated-direct-rules-benchmark-v1"
          assert report["benchmark_sha256"] == (
              "a426af3fab31afc2b8a71b8d4d052b7ade1f703f14aef714112344a894b844f0"
          )
          assert report["run_id"] == (
              "f34b4160c45339e4fe36bc79a96a0b9e82ddd2badb070ca8da9bfdda24d7887d"
          )
          assert report["status"] == "engineering_validated"
          assert report["reason_codes"] == []
          assert report["strategy"] == "substitution-rules-v1"
          assert report["learned_ranking_attempted"] is False
          assert report["counts"] == {
              "allergen_filtered": 2,
              "cases": 6,
              "cases_with_expected_results": 5,
              "caution_mismatches": 0,
              "constraint_violations": 0,
              "dietary_filtered": 2,
              "direct_candidates_considered": 13,
              "eligible_candidates": 9,
              "empty_expected_cases": 1,
              "exact_ranking_matches": 6,
              "expected_candidates": 9,
              "matching_candidates": 9,
              "missing_explanations": 0,
              "missing_provenance_or_confidence": 0,
              "missing_ratio_or_guidance": 0,
              "non_direct_outputs": 0,
              "returned_candidates": 9,
              "top1_matches": 5,
          }
          assert report["metrics"] == {
              "candidate_recall": "1.000000",
              "caution_compliance": "1.000000",
              "constraint_compliance": "1.000000",
              "direct_edge_precision": "1.000000",
              "empty_result_accuracy": "1.000000",
              "exact_ranking_accuracy": "1.000000",
              "explanation_coverage": "1.000000",
              "provenance_or_confidence_coverage": "1.000000",
              "ratio_or_guidance_coverage": "1.000000",
              "top1_accuracy": "1.000000",
          }
          assert report["limitations"] == [
              (
                  "Ingredient metadata contains positive declarations only; "
                  "missing metadata is unknown."
              ),
              "No learned substitution ranking was trained or evaluated.",
              (
                  "No substitution impressions, selections, rejection reasons, "
                  "or cooking outcomes exist."
              ),
              (
                  "The benchmark cases are synthetic engineering fixtures, "
                  "not user-outcome evidence."
              ),
              (
                  "The live demo catalog has one outgoing candidate per "
                  "substitution source."
              ),
              (
                  "The report validates deterministic rules and constraints, "
                  "not medical or food safety."
              ),
          ]
          PY

      - name: Verify duplicate-candidate evaluation report
        shell: bash
        run: |
          recipe-lab-eval duplicate-run \
            --benchmark tests/fixtures/duplicate_candidates_v1.json \
            --output "$RUNNER_TEMP/duplicate-report-a.json" --strict
          recipe-lab-eval duplicate-run \
            --benchmark tests/fixtures/duplicate_candidates_v1.json \
            --output "$RUNNER_TEMP/duplicate-report-b.json" --strict
          cmp "$RUNNER_TEMP/duplicate-report-a.json" \
            "$RUNNER_TEMP/duplicate-report-b.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "duplicate-report-a.json").read_text()
          )
          assert report["schema_version"] == (
              "recipe-lab-duplicate-evaluation-report-v1"
          )
          assert report["protocol_version"] == (
              "labeled-structural-pair-evaluation-v1"
          )
          assert report["benchmark_sha256"] == (
              "89174416e4398e58ef1ea5b2af0cdaa1681c22199b5f455803a384533304dc24"
          )
          assert report["run_id"] == (
              "748e785d55410ff42856c07dbb2521d7dd0b8b8e68809fabcc2c82a7ebf8e24e"
          )
          assert report["status"] == "engineering_validated"
          assert report["reason_codes"] == []
          assert report["advisory_only"] is True
          assert report["learned_classifier_attempted"] is False
          assert report["scoring"] == {
              "action_subweights": {
                  "action_order": "0.500000",
                  "duration_temperature": "0.200000",
                  "ordered_inputs": "0.300000",
              },
              "algorithm": "deterministic_explainable_structural_similarity",
              "algorithm_version": "duplicate-candidate-similarity-v1",
              "capacity": {
                  "maximum_actions_per_structure": 500,
                  "maximum_flattened_inputs_per_structure": 2000,
                  "maximum_ingredient_occurrences_per_structure": 200,
                  "maximum_nonexact_pair_work_units": 10000000,
                  "overflow_behavior": "fail_closed",
                  "pair_work_estimate": (
                      "(1 + 2 * left_ingredients * right_ingredients) * "
                      "(left_ingredients + right_ingredients) + "
                      "2 * left_actions * right_actions + "
                      "left_inputs * right_inputs"
                  ),
              },
              "maximum_reasons": 3,
              "parameter_sha256": (
                  "2ee8c0d10459115b7269859c3a62dbe2da75b44841a148424e74d09955773ee2"
              ),
              "probable_duplicate_threshold": "0.800000",
              "structure_version": "recipe-structure-v1",
              "weights": {
                  "ingredient_multiset": "0.450000",
                  "normalized_quantities": "0.250000",
                  "structured_actions": "0.300000",
              },
          }
          assert report["positive_classifications"] == [
              "exact_duplicate",
              "probable_duplicate",
          ]
          assert report["counts"] == {
              "cases": 11,
              "cases_with_complete_explanations": 11,
              "cases_matching_expected_components": 11,
              "classification_matches": 11,
              "covered_categories": 11,
              "evaluated_cases": 11,
              "expected": {
                  "distinct": 2,
                  "exact_duplicate": 4,
                  "probable_duplicate": 5,
              },
              "expected_positive": 9,
              "false_negatives": 0,
              "false_positives": 0,
              "predicted": {
                  "distinct": 2,
                  "exact_duplicate": 4,
                  "probable_duplicate": 5,
              },
              "predicted_positive": 9,
              "required_categories": 11,
              "true_positives": 9,
          }
          assert report["metrics"] == {
              "category_coverage": "1.000000",
              "component_expectation_coverage": "1.000000",
              "evaluated_coverage": "1.000000",
              "explanation_coverage": "1.000000",
              "precision": "1.000000",
              "recall": "1.000000",
              "three_class_accuracy": "1.000000",
          }
          assert report["error_categories"] == {
              "classification_mismatches": [],
              "component_mismatches": [],
              "explanation_mismatches": [],
              "false_negatives": [],
              "false_positives": [],
          }
          PY

      - name: Upload reproducibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: offline-evaluation-report
          path: |
            ${{ runner.temp }}/evaluation-report-a.json
            ${{ runner.temp }}/readiness-report-a.json
            ${{ runner.temp }}/collaborative-report-a.json
            ${{ runner.temp }}/hybrid-report-a.json
            ${{ runner.temp }}/substitution-report-a.json
            ${{ runner.temp }}/duplicate-report-a.json
          if-no-files-found: ignore
          retention-days: 7

  mvp-acceptance:
    name: MVP acceptance
    if: ${{ always() }}
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@127.0.0.1:5432/recipe_lab_acceptance
      CORS_ORIGINS: http://127.0.0.1:3000
      AUTH_ALLOWED_ORIGINS: http://127.0.0.1:3000
      RECIPE_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
      ACCEPTANCE_DATABASE_ISOLATED: "1"
      MVP_ACCEPTANCE: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start -- --hostname 127.0.0.1 --port 3000
      INTERNAL_NETWORK_SIGNAL_SECRET: recipe-lab-ci-internal-network-signal-secret
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recipe_lab_acceptance
          POSTGRES_USER: recipe_lab
          POSTGRES_PASSWORD: recipe_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_lab -d recipe_lab_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Configure acceptance fixture path
        shell: bash
        run: |
          echo "ACCEPTANCE_SESSION_FIXTURE=$RUNNER_TEMP/recipe-lab-acceptance-sessions.json" \
            >> "$GITHUB_ENV"

      - name: Require backend and frontend quality gates
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [[ "$BACKEND_RESULT" != "success" || "$FRONTEND_RESULT" != "success" ]]; then
            echo "Backend quality: $BACKEND_RESULT"
            echo "Frontend quality: $FRONTEND_RESULT"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up locked Python resolver
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv lock --check
          uv sync --frozen --package recipe-lab-api
          uv pip check
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Migrate and seed acceptance database
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m app.seeds load

      - name: Provision isolated acceptance member, curator, and moderator sessions
        working-directory: backend
        run: python -m app.testing.acceptance_sessions

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start backend
        working-directory: backend
        shell: bash
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/recipe-lab-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/recipe-lab-backend.pid"

      - name: Wait for backend readiness
        shell: bash
        run: |
          backend_pid="$(cat "$RUNNER_TEMP/recipe-lab-backend.pid")"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/recipe-lab-backend.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/recipe-lab-backend.log"
          exit 1

      - name: Run MVP browser acceptance suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Remove acceptance session fixture
        if: always()
        shell: bash
        run: rm -f -- "$ACCEPTANCE_SESSION_FIXTURE"

      - name: Upload acceptance diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: mvp-acceptance-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/recipe-lab-backend.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/recipe-lab-backend.pid"; then
            kill "$(cat "$RUNNER_TEMP/recipe-lab-backend.pid")" 2>/dev/null || true
          fi

  rcp32-acceptance:
    name: RCP-32 acceptance
    if: ${{ always() }}
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@127.0.0.1:5432/recipe_lab_rcp32_acceptance
      CORS_ORIGINS: http://127.0.0.1:3100
      AUTH_ALLOWED_ORIGINS: http://127.0.0.1:3100
      APP_ENVIRONMENT: local
      OIDC_ISSUER: http://127.0.0.1:8200
      OIDC_CLIENT_ID: recipe-lab-rcp32
      OIDC_REDIRECT_URI: http://127.0.0.1:3100/api/auth/callback
      OIDC_SCOPES: openid email profile
      OIDC_ALLOWED_SIGNING_ALGORITHMS: RS256
      RECIPE_API_URL: http://127.0.0.1:8100
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8100
      NEXT_TELEMETRY_DISABLED: "1"
      RCP32_ACCEPTANCE: "1"
      ACCEPTANCE_DATABASE_ISOLATED: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      PLAYWRIGHT_WEB_SERVER_COMMAND: APP_ENVIRONMENT=production npm run start -- --hostname 127.0.0.1 --port 3100
      RCP32_PYTHON_EXECUTABLE: python
      ABUSE_RATE_LIMIT_SECRET: recipe-lab-rcp32-ci-rate-limit-secret-2026
      INTERNAL_NETWORK_SIGNAL_SECRET: recipe-lab-rcp32-ci-network-signal-secret-2026
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recipe_lab_rcp32_acceptance
          POSTGRES_USER: recipe_lab
          POSTGRES_PASSWORD: recipe_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_lab -d recipe_lab_rcp32_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Configure private runner paths
        shell: bash
        run: |
          {
            echo "RCP32_MANIFEST_PATH=$RUNNER_TEMP/recipe-lab-rcp32-manifest.json"
            echo "RCP32_BACKUP_PATH=$RUNNER_TEMP/recipe-lab-rcp32-backup.dump"
            echo "RCP32_SAFE_ARTIFACT_DIR=$RUNNER_TEMP/recipe-lab-rcp32-safe-summaries"
            echo "RCP32_BACKEND_LOG=$RUNNER_TEMP/recipe-lab-rcp32-backend.log"
            echo "RCP32_OIDC_LOG=$RUNNER_TEMP/recipe-lab-rcp32-oidc.log"
            echo "RCP32_BROWSER_LOG=$RUNNER_TEMP/recipe-lab-rcp32-browser.log"
          } >> "$GITHUB_ENV"

      - name: Require backend and frontend quality gates
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [[ "$BACKEND_RESULT" != "success" || "$FRONTEND_RESULT" != "success" ]]; then
            echo "Backend quality: $BACKEND_RESULT"
            echo "Frontend quality: $FRONTEND_RESULT"
            exit 1
          fi

      - name: Check out repository
        id: checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up locked Python resolver
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend release-gate harness
        id: install-backend
        working-directory: backend
        run: |
          uv lock --check
          uv sync --frozen --package recipe-lab-api
          uv pip check
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prepare private runner paths
        shell: bash
        run: |
          umask 077
          install -d -m 0700 -- "$RCP32_SAFE_ARTIFACT_DIR"
          : > "$RCP32_BACKEND_LOG"
          : > "$RCP32_OIDC_LOG"
          : > "$RCP32_BROWSER_LOG"

      - name: Rehearse migrations, seed, and stage legacy demo evidence
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python -m alembic check
          python -m app.seeds load
          python -m app.testing.community_release_gate stage-demo-activity

      - name: Build the production frontend
        working-directory: frontend
        run: npm run build

      - name: Start guarded local identity provider
        working-directory: backend
        shell: bash
        run: |
          umask 077
          nohup python -m app.testing.local_oidc_provider \
            --host 127.0.0.1 \
            --port 8200 \
            > "$RCP32_OIDC_LOG" 2>&1 &
          echo $! > "$RUNNER_TEMP/recipe-lab-rcp32-oidc.pid"

      - name: Start backend without access logs
        working-directory: backend
        shell: bash
        run: |
          umask 077
          nohup python -m uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8100 \
            --no-access-log \
            > "$RCP32_BACKEND_LOG" 2>&1 &
          echo $! > "$RUNNER_TEMP/recipe-lab-rcp32-backend.pid"

      - name: Wait for isolated services
        shell: bash
        run: |
          oidc_pid="$(cat "$RUNNER_TEMP/recipe-lab-rcp32-oidc.pid")"
          backend_pid="$(cat "$RUNNER_TEMP/recipe-lab-rcp32-backend.pid")"
          for attempt in {1..45}; do
            oidc_ready=0
            backend_ready=0
            curl --fail --silent http://127.0.0.1:8200/health > /dev/null && oidc_ready=1
            curl --fail --silent http://127.0.0.1:8100/api/health > /dev/null && backend_ready=1
            if [[ "$oidc_ready" == "1" && "$backend_ready" == "1" ]]; then
              exit 0
            fi
            if ! kill -0 "$oidc_pid" 2>/dev/null || ! kill -0 "$backend_pid" 2>/dev/null; then
              echo "An isolated RCP-32 service stopped before becoming ready."
              exit 1
            fi
            sleep 1
          done
          echo "The isolated RCP-32 services did not become ready in time."
          exit 1

      - name: Run only the community release-gate browser journey
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run test:e2e:release-gate > "$RCP32_BROWSER_LOG" 2>&1
          browser_result=$?
          set -e
          if [[ "$browser_result" != "0" ]]; then
            echo "The RCP-32 browser journey failed; private diagnostics were withheld."
            exit "$browser_result"
          fi

      - name: Verify live community evidence
        working-directory: backend
        shell: bash
        run: |
          umask 077
          python -m app.testing.community_release_gate \
            verify \
            --manifest "$RCP32_MANIFEST_PATH" \
            > "$RCP32_SAFE_ARTIFACT_DIR/live-database-summary.json"

      - name: Back up and restore into the allowlisted recovery database
        shell: bash
        run: |
          umask 077
          docker run --rm --network host \
            -e PGPASSWORD=recipe_lab \
            postgres:17-alpine \
            pg_dump \
              --host 127.0.0.1 \
              --username recipe_lab \
              --dbname recipe_lab_rcp32_acceptance \
              --format custom \
              --no-owner \
              --no-privileges \
            > "$RCP32_BACKUP_PATH"
          docker run --rm --network host \
            -e PGPASSWORD=recipe_lab \
            postgres:17-alpine \
            dropdb \
              --host 127.0.0.1 \
              --username recipe_lab \
              --if-exists \
              recipe_lab_rcp32_acceptance_restore
          docker run --rm --network host \
            -e PGPASSWORD=recipe_lab \
            postgres:17-alpine \
            createdb \
              --host 127.0.0.1 \
              --username recipe_lab \
              recipe_lab_rcp32_acceptance_restore
          docker run --rm --interactive --network host \
            -e PGPASSWORD=recipe_lab \
            postgres:17-alpine \
            pg_restore \
              --host 127.0.0.1 \
              --username recipe_lab \
              --dbname recipe_lab_rcp32_acceptance_restore \
              --exit-on-error \
              --no-owner \
              --no-privileges \
            < "$RCP32_BACKUP_PATH"

      - name: Verify restored community evidence
        working-directory: backend
        shell: bash
        env:
          DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@127.0.0.1:5432/recipe_lab_rcp32_acceptance_restore
        run: |
          umask 077
          python -m alembic check
          python -m app.testing.community_release_gate \
            verify \
            --manifest "$RCP32_MANIFEST_PATH" \
            > "$RCP32_SAFE_ARTIFACT_DIR/restored-database-summary.json"
          cmp --silent \
            "$RCP32_SAFE_ARTIFACT_DIR/live-database-summary.json" \
            "$RCP32_SAFE_ARTIFACT_DIR/restored-database-summary.json"

      - name: Scan release-gate logs, manifest, and summaries for private markers
        if: ${{ always() && steps.install-backend.outcome == 'success' }}
        working-directory: backend
        shell: bash
        run: |
          umask 077
          scan_paths=("$RCP32_SAFE_ARTIFACT_DIR")
          for path in \
            "$RCP32_BACKEND_LOG" \
            "$RCP32_OIDC_LOG" \
            "$RCP32_BROWSER_LOG" \
            "$RCP32_MANIFEST_PATH" \
            "$GITHUB_WORKSPACE/frontend/test-results" \
            "$GITHUB_WORKSPACE/frontend/playwright-report"; do
            if [[ -e "$path" ]]; then
              scan_paths+=("$path")
            fi
          done
          scan_summary="$RUNNER_TEMP/recipe-lab-rcp32-privacy-summary.json.tmp"
          python -m app.testing.community_release_gate \
            scan-artifacts \
            "${scan_paths[@]}" \
            > "$scan_summary"
          mv -- "$scan_summary" "$RCP32_SAFE_ARTIFACT_DIR/privacy-summary.json"

      - name: Remove private release-gate material and stop services
        if: always()
        shell: bash
        run: |
          set +e
          cleanup_result=0
          for pid_file in \
            "$RUNNER_TEMP/recipe-lab-rcp32-backend.pid" \
            "$RUNNER_TEMP/recipe-lab-rcp32-oidc.pid"; do
            if [[ -f "$pid_file" ]]; then
              if ! pid="$(cat "$pid_file")"; then
                cleanup_result=1
              elif [[ "$pid" =~ ^[0-9]+$ ]]; then
                kill "$pid" 2>/dev/null || true
              else
                cleanup_result=1
              fi
            fi
          done
          docker run --rm --network host \
            -e PGPASSWORD=recipe_lab \
            postgres:17-alpine \
            dropdb \
              --host 127.0.0.1 \
              --username recipe_lab \
              --force \
              --if-exists \
              recipe_lab_rcp32_acceptance_restore \
            > /dev/null 2>&1 || cleanup_result=1
          rm -f -- \
            "$RUNNER_TEMP/recipe-lab-rcp32-backend.pid" \
            "$RUNNER_TEMP/recipe-lab-rcp32-oidc.pid" \
            "$RUNNER_TEMP/recipe-lab-rcp32-privacy-summary.json.tmp" \
            "$RCP32_BACKEND_LOG" \
            "$RCP32_OIDC_LOG" \
            "$RCP32_BROWSER_LOG" \
            "$RCP32_MANIFEST_PATH" \
            "$RCP32_BACKUP_PATH" || cleanup_result=1
          find "$RUNNER_TEMP" \
            -maxdepth 1 \
            -type f \
            -name 'recipe-lab-rcp32-manifest.json.rcp32-*.tmp' \
            -delete || cleanup_result=1
          rm -rf -- \
            "$GITHUB_WORKSPACE/frontend/test-results" \
            "$GITHUB_WORKSPACE/frontend/playwright-report" || cleanup_result=1
          exit "$cleanup_result"

      - name: Upload privacy-safe community release summaries
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: rcp32-community-release-gate-summaries
          path: |
            ${{ runner.temp }}/recipe-lab-rcp32-safe-summaries/live-database-summary.json
            ${{ runner.temp }}/recipe-lab-rcp32-safe-summaries/restored-database-summary.json
            ${{ runner.temp }}/recipe-lab-rcp32-safe-summaries/privacy-summary.json
          if-no-files-found: error
          retention-days: 7

  rcp32-release-gate:
    name: RCP-32 community release gate
    if: ${{ always() }}
    # Backend quality owns bounded-body, abuse, rollback, idempotency, and concurrency proofs.
    # Offline evaluation is intentionally independent of the deployable community gate.
    needs:
      - backend
      - frontend
      - mvp-acceptance
      - production-images
      - rcp32-acceptance
      - source-package
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every deployable application gate
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          MVP_ACCEPTANCE_RESULT: ${{ needs.mvp-acceptance.result }}
          PRODUCTION_IMAGES_RESULT: ${{ needs.production-images.result }}
          RCP32_ACCEPTANCE_RESULT: ${{ needs.rcp32-acceptance.result }}
          SOURCE_PACKAGE_RESULT: ${{ needs.source-package.result }}
        run: |
          if [[ "$BACKEND_RESULT" != "success" \
            || "$FRONTEND_RESULT" != "success" \
            || "$MVP_ACCEPTANCE_RESULT" != "success" \
            || "$PRODUCTION_IMAGES_RESULT" != "success" \
            || "$RCP32_ACCEPTANCE_RESULT" != "success" \
            || "$SOURCE_PACKAGE_RESULT" != "success" ]]; then
            echo "Backend quality: $BACKEND_RESULT"
            echo "Frontend quality: $FRONTEND_RESULT"
            echo "MVP acceptance: $MVP_ACCEPTANCE_RESULT"
            echo "Production images: $PRODUCTION_IMAGES_RESULT"
            echo "RCP-32 acceptance: $RCP32_ACCEPTANCE_RESULT"
            echo "Safe source package: $SOURCE_PACKAGE_RESULT"
            exit 1
          fi
