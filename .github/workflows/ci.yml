          )
          assert report["status"] == "engineering_validated"
          assert report["reason_codes"] == []
          assert report["advisory_only"] is True
          assert report["learned_classifier_attempted"] is False
          assert report["scoring"] == {
              "action_subweights": {
                  "action_order": "0.500000",
                  "duration_temperature": "0.200000",
                  "ordered_inputs": "0.300000",
              },
              "algorithm": "deterministic_explainable_structural_similarity",
              "algorithm_version": "duplicate-candidate-similarity-v1",
              "capacity": {
                  "maximum_actions_per_structure": 500,
                  "maximum_flattened_inputs_per_structure": 2000,
                  "maximum_ingredient_occurrences_per_structure": 200,
                  "maximum_nonexact_pair_work_units": 10000000,
                  "overflow_behavior": "fail_closed",
                  "pair_work_estimate": (
                      "(1 + 2 * left_ingredients * right_ingredients) * "
                      "(left_ingredients + right_ingredients) + "
                      "2 * left_actions * right_actions + "
                      "left_inputs * right_inputs"
                  ),
              },
              "maximum_reasons": 3,
              "parameter_sha256": (
                  "2ee8c0d10459115b7269859c3a62dbe2da75b44841a148424e74d09955773ee2"
              ),
              "probable_duplicate_threshold": "0.800000",
              "structure_version": "recipe-structure-v1",
              "weights": {
                  "ingredient_multiset": "0.450000",
                  "normalized_quantities": "0.250000",
                  "structured_actions": "0.300000",
              },
          }
          assert report["positive_classifications"] == [
              "exact_duplicate",
              "probable_duplicate",
          ]
          assert report["counts"] == {
              "cases": 11,
              "cases_with_complete_explanations": 11,
              "cases_matching_expected_components": 11,
              "classification_matches": 11,
              "covered_categories": 11,
              "evaluated_cases": 11,
              "expected": {
                  "distinct": 2,
                  "exact_duplicate": 4,
                  "probable_duplicate": 5,
              },
              "expected_positive": 9,
              "false_negatives": 0,
              "false_positives": 0,
              "predicted": {
                  "distinct": 2,
                  "exact_duplicate": 4,
                  "probable_duplicate": 5,
              },
              "predicted_positive": 9,
              "required_categories": 11,
              "true_positives": 9,
          }
          assert report["metrics"] == {
              "category_coverage": "1.000000",
              "component_expectation_coverage": "1.000000",
              "evaluated_coverage": "1.000000",
              "explanation_coverage": "1.000000",
              "precision": "1.000000",
              "recall": "1.000000",
              "three_class_accuracy": "1.000000",
          }
          assert report["error_categories"] == {
              "classification_mismatches": [],
              "component_mismatches": [],
              "explanation_mismatches": [],
              "false_negatives": [],
              "false_positives": [],
          }
          PY

      - name: Upload reproducibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: offline-evaluation-report
          path: |
            ${{ runner.temp }}/evaluation-report-a.json
            ${{ runner.temp }}/readiness-report-a.json
            ${{ runner.temp }}/collaborative-report-a.json
            ${{ runner.temp }}/hybrid-report-a.json
            ${{ runner.temp }}/substitution-report-a.json
            ${{ runner.temp }}/duplicate-report-a.json
          if-no-files-found: ignore
          retention-days: 7

  mvp-acceptance:
    name: MVP acceptance
    if: ${{ always() }}
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://recipe_lab:recipe_lab@127.0.0.1:5432/recipe_lab_acceptance
      CORS_ORIGINS: http://127.0.0.1:3000
      AUTH_ALLOWED_ORIGINS: http://127.0.0.1:3000
      RECIPE_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
      ACCEPTANCE_DATABASE_ISOLATED: "1"
      MVP_ACCEPTANCE: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start -- --hostname 127.0.0.1 --port 3000
      INTERNAL_NETWORK_SIGNAL_SECRET: recipe-lab-ci-internal-network-signal-secret
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recipe_lab_acceptance
          POSTGRES_USER: recipe_lab
          POSTGRES_PASSWORD: recipe_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_lab -d recipe_lab_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Configure acceptance fixture path
        shell: bash
        run: |
          echo "ACCEPTANCE_SESSION_FIXTURE=$RUNNER_TEMP/recipe-lab-acceptance-sessions.json" \
            >> "$GITHUB_ENV"

      - name: Require backend and frontend quality gates
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [[ "$BACKEND_RESULT" != "success" || "$FRONTEND_RESULT" != "success" ]]; then
            echo "Backend quality: $BACKEND_RESULT"
            echo "Frontend quality: $FRONTEND_RESULT"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Migrate and seed acceptance database
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m app.seeds load

      - name: Provision isolated acceptance member, curator, and moderator sessions
        working-directory: backend
        run: python -m app.testing.acceptance_sessions

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start backend
        working-directory: backend
        shell: bash
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/recipe-lab-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/recipe-lab-backend.pid"

      - name: Wait for backend readiness
        shell: bash
        run: |
          backend_pid="$(cat "$RUNNER_TEMP/recipe-lab-backend.pid")"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/recipe-lab-backend.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/recipe-lab-backend.log"
          exit 1

      - name: Run MVP browser acceptance suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Remove acceptance session fixture
        if: always()
        shell: bash
        run: rm -f -- "$ACCEPTANCE_SESSION_FIXTURE"

      - name: Upload acceptance diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: mvp-acceptance-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/recipe-lab-backend.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/recipe-lab-backend.pid"; then
            kill "$(cat "$RUNNER_TEMP/recipe-lab-backend.pid")" 2>/dev/null || true
          fi
